name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  tests:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          # CPU-сборка torch: на раннере нет GPU, полное колесо тянет ~2.5 ГБ
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Тесты
        # Все три теста офлайновые: цены, новости и эмбеддинги синтетические,
        # сеть и FINNHUB_API_KEY не нужны.
        run: pytest tests/ -v --tb=short

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Сборка
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: stock-predict-mvp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
